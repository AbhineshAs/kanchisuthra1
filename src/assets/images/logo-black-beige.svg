<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <g transform="translate(120, 22)" text-anchor="middle">
    <!-- Intricate Traditional South Indian Woven Knot Emblem in Warm Beige Gold -->
    <g transform="scale(0.85) translate(0, -8)">
      <!-- Outer diamond accent dots -->
      <circle cx="0" cy="-18" r="1.5" fill="#c09b63" />
      <circle cx="18" cy="0" r="1.5" fill="#c09b63" />
      <circle cx="0" cy="18" r="1.5" fill="#c09b63" />
      <circle cx="-18" cy="0" r="1.5" fill="#c09b63" />
      
      <!-- Interwoven Endless Knot Paths -->
      <path d="M 0 -13 C 6 -13 13 -6 13 0 C 13 6 6 13 0 13 C -6 13 -13 6 -13 0 C -13 -6 -6 -13 0 -13 Z" 
            fill="none" stroke="#c09b63" stroke-width="1.8" />
      <path d="M -9 -9 C -3 -15 3 -15 9 -9 C 15 -3 15 3 9 9 C 3 15 -3 15 -9 9 C -15 3 -15 -3 -9 -9 Z" 
            fill="none" stroke="#c09b63" stroke-width="1.8" />
      <rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" 
            fill="none" stroke="#c09b63" stroke-width="1.5" />
      <circle cx="0" cy="0" r="2.5" fill="#c09b63" />
    </g>

    <!-- Brand Name Text in Deep Rich Black -->
    <text x="0" y="24" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
          font-size="18" 
          font-weight="600" 
          letter-spacing="1.5" 
          fill="#1c1c1c">
      Kanchisuthra
    </text>

    <!-- Subtext in Dark Charcoal / Beige accent -->
    <text x="0" y="35" 
          font-family="'Inter', 'Montserrat', sans-serif" 
          font-size="6.5" 
          font-weight="500" 
          letter-spacing="2.5" 
          fill="#666666">
      BY KANCHIPURAM WEAVERS
    </text>
  </g>
</svg>
